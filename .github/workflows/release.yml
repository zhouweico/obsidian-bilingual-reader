name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # artifact attestation 需要 OIDC 令牌签发来源证明；缺这两个权限 attest 步骤会直接失败。
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify sources
        run: |
          node --check main.js
          for f in manifest.json main.js styles.css versions.json; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
          done

      - name: Verify manifest and tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # 用 jq 精确取顶层 .version：grep '"version"' 会匹配到任何含该字符串的行，
          # 一旦 manifest 里出现嵌套或描述性的 version 字段就会取错值。
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          echo "tag=$TAG manifest=$MANIFEST_VERSION"
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag ($TAG) does not match manifest.json version ($MANIFEST_VERSION)"
            exit 1
          fi
          # versions.json 是 Obsidian 用于按 App 版本分发的映射表，缺失对应条目会导致旧版客户端拿不到更新
          if ! jq -e --arg v "$MANIFEST_VERSION" 'has($v)' versions.json > /dev/null; then
            echo "::error::versions.json is missing an entry for $MANIFEST_VERSION"
            exit 1
          fi
          # 社区目录硬性规则：id 只能用小写字母与连字符且不含 obsidian；
          # name 必须是 Basic Latin（全库 9200+ 插件无一 CJK 名称）；description 必须以英文句点结尾。
          ID=$(jq -r '.id' manifest.json)
          NAME=$(jq -r '.name' manifest.json)
          DESC=$(jq -r '.description' manifest.json)
          echo "$ID" | grep -Eq '^[a-z0-9-]+$' || { echo "::error::id must be lowercase letters and hyphens only"; exit 1; }
          case "$ID" in *obsidian*) echo "::error::id must not contain 'obsidian'"; exit 1 ;; esac
          case "$NAME" in *[!\ -~]*) echo "::error::name must use Basic Latin characters only"; exit 1 ;; esac
          case "$DESC" in *.) ;; *) echo "::error::description must end with a period"; exit 1 ;; esac

      # 社区目录的 Releases 检查会把「缺 artifact attestation」标为 Recommendation。
      # 必须先签发再上传：attestation 按文件摘要绑定，与上传顺序无关，但社区目录只认发布时的资产摘要。
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 发布说明优先取 .github/release-notes/<tag>.md；缺失时退回 GitHub 自动生成的变更列表。
          NOTES=".github/release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then
            echo "使用 $NOTES 作为发布说明"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              manifest.json main.js styles.css
          else
            echo "未找到 $NOTES，使用自动生成的发布说明"
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              manifest.json main.js styles.css
          fi
